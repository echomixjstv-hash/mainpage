<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Girls vs Boys Quiz</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#080b11;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  padding:7px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* SCORE */

.scores{
  height:68px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:1fr 45px 1fr;
  gap:6px;
}

.team{
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 15px #0008;
}

.girls{
  background:linear-gradient(145deg,#ec347d,#771540);
}

.boys{
  background:linear-gradient(145deg,#2b84f3,#123b8b);
}

.teamName{
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

.score{
  font-size:28px;
  font-weight:900;
}

.vs{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
  font-weight:900;
}

/* QUESTION */

.questionBox{
  height:108px;
  flex-shrink:0;
  margin-top:7px;
  border-radius:15px;
  background:#202630;
  border:1px solid #363e4c;
  position:relative;
  padding:22px 10px 8px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.qTop{
  position:absolute;
  top:5px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  color:#a4adbb;
}

.badges{
  display:flex;
  gap:4px;
}

.badge{
  padding:3px 7px;
  border-radius:15px;
  color:white;
  font-size:8px;
  font-weight:900;
}

.category{
  background:#475467;
}

.easy{
  background:#20a85a;
}

.medium{
  background:#c58b20;
}

.hard{
  background:#d13a48;
}

.question{
  font-size:19px;
  line-height:1.2;
  font-weight:800;
}

/* ANSWERS */

.answers{
  margin-top:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex-shrink:0;
}

.answer{
  width:100%;
  height:40px;
  border:0;
  border-radius:10px;
  color:white;
  display:flex;
  align-items:center;
  padding:4px 10px;
  font-size:14px;
  font-weight:bold;
  text-align:left;
}

.answer span{
  width:29px;
  height:29px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:9px;
  background:#0004;
}

.a{background:#d84b5c}
.b{background:#d68b2d}
.c{background:#398fd0}
.d{background:#7556c7}

.answer.correct{
  background:#16a94d!important;
  box-shadow:0 0 0 3px #53ff87,0 0 20px #53ff8766;
}

.answer.blink{
  animation:greenBlink .5s infinite alternate;
}

@keyframes greenBlink{
  from{
    background:#16a94d;
    box-shadow:0 0 0 3px #54ff87;
  }
  to{
    background:#063d20;
    box-shadow:0 0 0 3px #54ff87,0 0 28px #54ff87;
  }
}

.answer.wrong{
  opacity:.3;
}

/* TIMER */

.timer{
  height:10px;
  margin-top:8px;
  flex-shrink:0;
  background:#252d2a;
  border-radius:20px;
  overflow:hidden;
}

.timerBar{
  width:100%;
  height:100%;
  background:#24dc6b;
}

/* STATUS */

.status{
  height:29px;
  flex-shrink:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  color:#6cff9a;
}

/* FLOATING */

.comments{
  height:62px;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:#171b22;
  border:1px solid #292f39;
}

.live{
  position:absolute;
  top:3px;
  left:8px;
  font-size:8px;
  color:#7d8795;
  z-index:5;
}

.avatar{
  position:absolute;
  bottom:-43px;
  width:38px;
  height:38px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid white;
  animation:floatUp 3.5s linear forwards;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(.5);
    opacity:0;
  }
  15%{opacity:1}
  75%{opacity:1}
  100%{
    transform:translateY(-105px) scale(1);
    opacity:0;
  }
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:#03050ae8;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.overlay.show{
  display:flex;
}

.panel{
  width:100%;
  max-width:430px;
  max-height:88vh;
  overflow:hidden;
  background:#1a1f28;
  border:1px solid #39414f;
  border-radius:22px;
  padding:18px;
  text-align:center;
  box-shadow:0 15px 50px #000b;
  animation:pop .3s ease;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* START */

.startTitle{
  font-size:22px;
  font-weight:900;
}

.countNumber{
  font-size:72px;
  font-weight:1000;
  margin-top:10px;
  animation:pulse .8s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(.9);opacity:.65}
  to{transform:scale(1.1);opacity:1}
}

.startCategory{
  margin-top:5px;
  font-size:13px;
  color:#9ea8b8;
}

/* RESULT */

.resultTitle{
  font-size:23px;
  font-weight:900;
}

.correctAnswer{
  color:#62ff97;
  font-size:14px;
  font-weight:bold;
  margin-top:6px;
}

.section{
  background:#10141b;
  border-radius:14px;
  padding:10px;
  margin-top:9px;
}

.sectionTitle{
  font-size:10px;
  color:#929baa;
  font-weight:bold;
  margin-bottom:6px;
}

.playerList{
  max-height:105px;
  overflow:hidden;
}

.player{
  display:flex;
  align-items:center;
  gap:7px;
  padding:4px;
  font-size:12px;
  font-weight:bold;
}

.player img{
  width:29px;
  height:29px;
  border-radius:50%;
  border:2px solid white;
}

.first{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.first img{
  width:52px;
  height:52px;
  border-radius:50%;
  border:3px solid white;
}

.roundPoints{
  margin-top:8px;
  font-size:14px;
  font-weight:900;
  color:#6cff9a;
}

.next{
  margin-top:12px;
  color:#778190;
  font-size:9px;
}

/* FINAL */

.finalTitle{
  font-size:35px;
  font-weight:1000;
  margin-bottom:7px;
}

.finalSub{
  font-size:12px;
  color:#aab2bf;
}

.finalScores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.finalTeam{
  padding:15px 5px;
  border-radius:15px;
}

.finalGirls{
  background:#8b174d;
}

.finalBoys{
  background:#164b9d;
}

.finalTeamName{
  font-size:11px;
  font-weight:bold;
}

.finalScore{
  font-size:32px;
  font-weight:900;
}

/* RESPONSIVE */

@media(max-height:650px){
  .app{padding:5px}
  .scores{height:61px}
  .questionBox{height:89px}
  .question{font-size:16px}
  .answer{height:35px;font-size:12px}
  .answer span{width:26px;height:26px}
  .timer{margin-top:5px}
  .status{height:24px}
  .comments{height:52px}
}
</style>
</head>

</div>


<!-- OVERLAY -->

<div class="overlay"
     id="overlay">
</div>


<script>

const QUESTIONS_PER_ROUND = 15;

  {

/* =====================================================
   BUILD 1500 QUESTION BANK
===================================================== */

let questionBank = [];

let id = 1;

const variations = [
  "",
  " — Choose the best answer.",
  " — What is the correct answer?",
  " — Select the correct choice.",
  " — Which answer is correct?"
];

for(let copy=0;copy<20;copy++){

  bankTemplates.forEach(template=>{

    ["easy","medium","hard"].forEach(level=>{

      template[level].forEach(item=>{

        const variation =
          variations[
            (copy + id) %
            variations.length
          ];

        questionBank.push({

          id:id++,

          category:
            template.category,

          difficulty:
            level.charAt(0).toUpperCase() +
            level.slice(1),

          points:
            level==="easy"
              ? 1
              : level==="medium"
                ? 2
                : 3,

          question:
            item[0] + variation,

          choices:
            item[1].slice(),

          correct:
            item[2]

        });

      });

    });

  });

}


/*
  Ensure exactly 1500 entries.
  The base data is repeated with harmless
  question wording variations for testing.
*/

while(questionBank.length < 1500){

  const source =
    questionBank[
      questionBank.length %
      questionBank.length
    ];

  questionBank.push({

    ...source,

    id:id++,

    question:
      source.question +
      " #" +
      id

  });

}

questionBank =
  questionBank.slice(0,1500);

/* =====================================================
   ELEMENTS
===================================================== */

const girlsScoreEl =
  document.getElementById("girlsScore");

const boysScoreEl =
  document.getElementById("boysScore");

const questionEl =
  document.getElementById("question");

const qNumberEl =
  document.getElementById("qNumber");

const categoryEl =
  document.getElementById("category");

const difficultyEl =
  document.getElementById("difficulty");

const timerBar =
  document.getElementById("timerBar");

const statusEl =
  document.getElementById("status");

const commentsEl =
  document.getElementById("comments");

const overlay =
  document.getElementById("overlay");

const buttons =
  document.querySelectorAll(".answer");


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  const arr =
    array.slice();

  for(let i=arr.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =====================================================
   NEW ROUND
===================================================== */

function newRound(){

  clearInterval(timer);
  clearInterval(commentTimer);

  girlsScore = 0;
  boysScore = 0;

  girlsScoreEl.textContent = "0";
  boysScoreEl.textContent = "0";

  currentQuestion = 0;

  /*
    Pick exactly 15 unique random questions
    from the 1500-question bank.
  */

  roundQuestions =
    shuffle(questionBank)
    .slice(0,15);

  showStartCountdown();

}


/* =====================================================
   5 SECOND START
===================================================== */

function showStartCountdown(){

  clearInterval(timer);
  clearInterval(commentTimer);

  overlay.classList.add("show");

  let count =
    START_COUNTDOWN;

  overlay.innerHTML =
    `
    <div class="panel">

      <div class="startTitle">
        START THE QUIZ IN
      </div>

      <div class="countNumber"
           id="startNumber">
        ${count}
      </div>

      <div class="startCategory">
        Get ready!
      </div>

    </div>
    `;


  const number =
    document.getElementById(
      "startNumber"
    );


  const countdown =
    setInterval(()=>{

      count--;

      if(count <= 0){

        clearInterval(countdown);

        overlay.classList.remove(
          "show"
        );

        loadQuestion();

        return;

      }

      number.textContent =
        count;

    },1000);

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

  current =
    roundQuestions[
      currentQuestion
    ];


  qNumberEl.textContent =
    "QUESTION " +
    (currentQuestion + 1) +
    " / 15";


  categoryEl.textContent =
    current.category;


  difficultyEl.textContent =
    current.difficulty.toUpperCase() +
    " ×" +
    current.points;


  difficultyEl.className =
    "badge " +
    (
      current.difficulty === "Easy"
        ? "easy"
        : current.difficulty === "Medium"
          ? "medium"
          : "hard"
    );


  questionEl.textContent =
    current.question;


  buttons.forEach((button,index)=>{

    button.disabled = false;

    button.classList.remove(
      "correct",
      "wrong",
      "blink"
    );

    button.querySelector(
      "label"
    ).textContent =
      current.choices[index];

  });


  statusEl.textContent =
    "Comment A, B, C, D for " +
    current.points +
    " point" +
    (
      current.points > 1
        ? "s"
        : ""
    ) +
    " entry";


  startTimer();

  startComments();

}


/* =====================================================
   20 SECOND TIMER
===================================================== */

function startTimer(){

  clearInterval(timer);

  timerBar.style.width =
    "100%";

  timerBar.style.background =
    "#24dc6b";

  questionStart =
    performance.now();


  timer =
    setInterval(()=>{

      const elapsed =
        performance.now() -
        questionStart;

      const remaining =
        Math.max(
          0,
          QUESTION_TIME -
          elapsed
        );


      const percent =
        remaining /
        QUESTION_TIME *
        100;


      timerBar.style.width =
        percent + "%";


      if(percent <= 35){

        timerBar.style.background =
          "#ffd43b";

      }

      if(percent <= 15){

        timerBar.style.background =
          "#ff4d5d";

      }


      if(remaining <= 0){

        clearInterval(timer);

        finishQuestion();

      }

    },40);

}


/* =====================================================
   FLOATING SIMULATED COMMENTS
===================================================== */

function startComments(){

  clearInterval(commentTimer);

  commentTimer =
    setInterval(()=>{

      const player =
        players[
          playerIndex %
          players.length
        ];

      playerIndex++;

      createAvatar(player);

    },550);

}


function createAvatar(player){

  const img =
    document.createElement(
      "img"
    );

  img.className =
    "avatar";

  img.src =
    player.image;

  img.title =
    player.name +
    " • " +
    player.team +
    " • " +
    player.answer;


  const max =
    commentsEl.clientWidth -
    45;


  img.style.left =
    Math.max(
      3,
      Math.random() *
      max
    ) + "px";


  img.style.borderColor =
    player.team === "Girls"
      ? "#f34b91"
      : "#3c94ff";


  commentsEl.appendChild(img);


  setTimeout(()=>{
    img.remove();
  },3600);

}


/* =====================================================
   FINISH QUESTION
===================================================== */

function finishQuestion(){

  clearInterval(timer);
  clearInterval(commentTimer);

  buttons.forEach(
    button=>{
      button.disabled = true;
    }
  );


  const correctButton =
    document.querySelector(
      `[data-answer="${current.correct}"]`
    );


  if(correctButton){

    correctButton.classList.add(
      "blink"
    );

  }


  statusEl.textContent =
    "REVEALING ANSWER...";


  setTimeout(()=>{

    if(correctButton){

      correctButton.classList.remove(
        "blink"
      );

      correctButton.classList.add(
        "correct"
      );

    }


    showResults();

  },BLINK_TIME);

}


/* =====================================================
   RESULTS
===================================================== */

function showResults(){

  /*
    In the test version, simulated players
    answer using their predefined answer.

    Every correct player gets points.
  */

  const correctPlayers =
    players.filter(
      p =>
        p.answer ===
        current.correct
    );


  let girlsRound = 0;
  let boysRound = 0;


  correctPlayers.forEach(
    player=>{

      if(player.team === "Girls"){

        girlsRound +=
          current.points;

      }else{

        boysRound +=
          current.points;

      }

    }
  );


  girlsScore +=
    girlsRound;

  boysScore +=
    boysRound;


  girlsScoreEl.textContent =
    girlsScore;

  boysScoreEl.textContent =
    boysScore;


  const correctIndex =
    current.correct.charCodeAt(0) -
    65;


  overlay.innerHTML =
    `
    <div class="panel">

      <div class="resultTitle">
        REVEAL ANSWER
      </div>

      <div class="correctAnswer">
        CORRECT: ${current.correct}
        — ${current.choices[correctIndex]}
      </div>

      <div class="section">

        <div class="sectionTitle">
          CORRECT PLAYERS
        </div>

        <div class="playerList"
             id="correctList">
        </div>

      </div>

      <div class="section">

        <div class="sectionTitle">
          FIRST TO ANSWER
        </div>

        <div class="first"
             id="firstPlayer">
        </div>

      </div>

      <div class="roundPoints">
        GIRLS +${girlsRound}
        &nbsp; • &nbsp;
        BOYS +${boysRound}
      </div>

      <div class="next">
        NEXT QUESTION...
      </div>

    </div>
    `;


  const list =
    document.getElementById(
      "correctList"
    );


  if(correctPlayers.length === 0){

    list.innerHTML =
      "<div class='player'>No correct answers</div>";

  }else{

    correctPlayers.forEach(
      player=>{

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "player";

        row.innerHTML =
          `
          <img src="${player.image}">
          <span>${player.name}</span>
          <small>
            ${player.team}
            +${current.points}
          </small>
          `;

        list.appendChild(row);

      }
    );

  }


  const first =
    correctPlayers[0];

  const firstBox =
    document.getElementById(
      "firstPlayer"
    );


  if(first){

    firstBox.innerHTML =
      `
      <img src="${first.image}">

      <strong>
        ${first.name}
      </strong>

      <span class="badge"
        style="
        background:
        ${first.team === "Girls"
          ? "#d92b78"
          : "#267ff0"}">
        ${first.team}
      </span>
      `;

  }else{

    firstBox.innerHTML =
      "<strong>No correct player</strong>";

  }


  overlay.classList.add(
    "show"
  );


  /*
    After result:
    next question or final result
  */

  setTimeout(()=>{

    overlay.classList.remove(
      "show"
    );


    currentQuestion++;


    if(
      currentQuestion >=
      QUESTIONS_PER_ROUND
    ){

      showFinalResult();

    }else{

      loadQuestion();

    }

  },4500);

}


/* =====================================================
   FINAL RESULT
===================================================== */

function showFinalResult(){

  clearInterval(timer);
  clearInterval(commentTimer);


  let winner;


  if(girlsScore > boysScore){

    winner =
      "GIRLS WIN";

  }else if(
    boysScore > girlsScore
  ){

    winner =
      "BOYS WIN";

  }else{

    winner =
      "DRAW";

  }


  overlay.innerHTML =
    `
    <div class="panel">

      <div class="finalTitle">
        ${winner}
      </div>

      <div class="finalSub">
        ROUND COMPLETE
      </div>

      <div class="finalScores">

        <div class="finalTeam finalGirls">

          <div class="finalTeamName">
            GIRLS
          </div>

          <div class="finalScore">
            ${girlsScore}
          </div>

        </div>

        <div class="finalTeam finalBoys">

          <div class="finalTeamName">
            BOYS
          </div>

          <div class="finalScore">
            ${boysScore}
          </div>

        </div>

      </div>

      <div class="next">
        NEW ROUND STARTING...
      </div>

    </div>
    `;


  overlay.classList.add(
    "show"
  );


  /*
    Automatically restart
    from the beginning.
  */

  setTimeout(()=>{

    overlay.classList.remove(
      "show"
    );

    newRound();

  },5000);

}


/* =====================================================
   MANUAL ANSWER TEST
===================================================== */

buttons.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      if(button.disabled)
        return;


      clearInterval(timer);
      clearInterval(commentTimer);


      buttons.forEach(
        b=>{
          b.disabled = true;
        }
      );


      if(
        button.dataset.answer ===
        current.correct
      ){

        button.classList.add(
          "correct"
        );

      }else{

        button.classList.add(
          "wrong"
        );


        const correctButton =
          document.querySelector(
            `[data-answer="${current.correct}"]`
          );


        if(correctButton){

          correctButton.classList.add(
            "correct"
          );

        }

      }


      finishQuestion();

    }
  );

});


/* =====================================================
   START
===================================================== */

newRound();

===================================================== */

document.addEventListener(
