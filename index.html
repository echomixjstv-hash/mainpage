<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Girls vs Boys Quiz</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06090f;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  padding:7px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}


/* =====================================================
   SCORE
===================================================== */

.scores{
  height:76px;
  flex-shrink:0;

  display:grid;
  grid-template-columns:1fr 38px 1fr;
  gap:6px;
}

.teamBox{
  position:relative;
  overflow:hidden;

  border-radius:15px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:1px solid #ffffff25;
  background:#151a22;
}

.teamFill{
  position:absolute;

  z-index:0;

  left:0;
  top:0;
  bottom:0;

  width:0%;

  transition:width .45s ease;
}

.girlsFill{
  background:linear-gradient(
    90deg,
    #8e164f,
    #e72d82
  );
}

.boysFill{
  background:linear-gradient(
    90deg,
    #164b9b,
    #287ff0
  );
}

.teamOverlay{
  position:absolute;
  inset:0;

  z-index:1;

  background:
    linear-gradient(
      180deg,
      #00000038,
      #00000012
    );
}

.teamContent{
  position:relative;

  z-index:2;

  width:100%;

  text-align:center;

  text-shadow:
    0 2px 5px #000,
    0 0 10px #0008;
}

.teamName{
  font-size:24px;
  line-height:1;
  font-weight:1000;
  letter-spacing:1px;
}

.teamScore{
  margin-top:5px;

  font-size:15px;
  font-weight:1000;
}

.vs{
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:1000;

  color:#fff;

  text-shadow:0 2px 5px #000;
}


/* =====================================================
   QUESTION
===================================================== */

.questionBox{
  height:104px;

  flex-shrink:0;

  margin-top:7px;

  padding:26px 10px 7px;

  border-radius:15px;

  border:1px solid #353d4a;

  background:#202630;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.qTop{
  position:absolute;

  left:7px;
  right:7px;
  top:5px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.qNumber{
  color:#a0a9b6;

  font-size:8px;
  font-weight:1000;
}

.badges{
  display:flex;
  gap:4px;
}

.badge{
  padding:3px 6px;

  border-radius:20px;

  font-size:7px;
  font-weight:1000;
}

.category{
  background:#596575;
}

.easy{
  background:#159b51;
}

.medium{
  background:#b77913;
}

.hard{
  background:#c52e3e;
}

.bossBadge{
  background:#9c1dcc;

  animation:
    bossGlow 1s infinite alternate;
}

@keyframes bossGlow{

  from{
    box-shadow:0 0 4px #c44aff;
  }

  to{
    box-shadow:0 0 18px #d36aff;
  }

}

.question{
  font-size:45px;
  line-height:1.15;

  font-weight:1000;

  text-align:center;
}


/* =====================================================
   ANSWERS
===================================================== */

.answers{

  margin-top:7px;

  display:flex;
  flex-direction:column;

  gap:7px;

  flex-shrink:0;
}

.answer{

  width:100%;

  height:48px;

  border:0;

  border-radius:12px;

  padding:10px 15px;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:20px;

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 #ffffff18,
    0 2px 5px #0005;

  transition:
    transform .1s ease,
    opacity .2s ease;
}

.answer:active{
  transform:scale(.98);
}

.answer span{

  width:30px;
  height:30px;

  flex-shrink:0;

  margin-right:9px;

  border-radius:50%;

  background:#0005;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:20px;
}

.answer label{

  flex:1;

  text-align:center;

  padding-right:40px;

  line-height:1.15;
}

.a{
  background:#d44b5b;
}

.b{
  background:#d48728;
}

.c{
  background:#398bc9;
}

.d{
  background:#7355c5;
}

.answer.correct{

  background:#12a84c!important;

  box-shadow:
    0 0 0 3px #66ff9a,
    0 0 25px #66ff9a88;
}

.answer.wrong{
  opacity:.25;
}

.answer.blink{

  animation:
    greenBlink .5s infinite alternate;
}

@keyframes greenBlink{

  from{
    background:#12a84c;

    box-shadow:
      0 0 0 3px #66ff9a;
  }

  to{
    background:#073d21;

    box-shadow:
      0 0 0 3px #66ff9a,
      0 0 30px #66ff9a;
  }

}


/* =====================================================
   TIMER
===================================================== */

.timer{

  height:8px;

  flex-shrink:0;

  margin-top:7px;

  overflow:hidden;

  border-radius:20px;

  background:#202823;
}

.timerBar{

  width:100%;
  height:100%;

  background:#21dc68;

  transition:width .04s linear;
}


/* =====================================================
   STATUS
===================================================== */

.status{

  height:28px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#66ff98;

  font-size:9px;

  font-weight:1000;
}


/* =====================================================
   COMMENTS
===================================================== */

.comments{

  height:62px;

  flex-shrink:0;

  position:relative;

  overflow:hidden;

  border-radius:12px;

  border:1px solid #2c333e;

  background:#161a21;
}

.live{

  position:absolute;

  z-index:10;

  top:4px;
  left:7px;

  color:#858f9e;

  font-size:7px;

  font-weight:bold;
}


/* =====================================================
   AVATAR
===================================================== */

.avatar{

  position:absolute;

  bottom:-42px;

  width:38px;
  height:38px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid white;

  animation:
    floatAvatar 3.5s linear forwards;

  z-index:2;
}

@keyframes floatAvatar{

  0%{
    transform:
      translateY(0)
      scale(.5);

    opacity:0;
  }

  15%{
    opacity:1;
  }

  75%{
    opacity:1;
  }

  100%{

    transform:
      translateY(-105px)
      scale(1);

    opacity:0;
  }

}


/* =====================================================
   JOIN NAME
===================================================== */

.joinName{

  position:absolute;

  left:7px;
  right:7px;

  bottom:4px;

  height:20px;

  z-index:20;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0 8px;

  border-radius:8px;

  background:#0009;

  color:#fff;

  font-size:10px;

  font-weight:1000;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  opacity:0;

  transform:translateY(8px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.joinName.show{

  opacity:1;

  transform:translateY(0);
}

.joinName span{

  color:#66ff98;

  margin-right:4px;
}


/* =====================================================
   GENDER COUNTER
===================================================== */

.genderCounter{

  height:27px;

  flex-shrink:0;

  margin-top:5px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;
}

.genderBox{

  border-radius:9px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:9px;

  font-weight:1000;

  border:1px solid #ffffff18;

  text-shadow:
    0 1px 3px #000;
}

.genderGirls{

  background:
    linear-gradient(
      90deg,
      #74123f,
      #c92170
    );
}

.genderBoys{

  background:
    linear-gradient(
      90deg,
      #123d80,
      #236dcc
    );
}


/* =====================================================
   LIVE ENTRY COUNTER
===================================================== */

.entryCounter{

  height:27px;

  flex-shrink:0;

  margin-top:5px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;
}

.entryBox{

  border-radius:9px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:5px;

  border:1px solid #ffffff18;

  background:#151a21;

  font-size:20px;

  font-weight:1000;

  text-shadow:
    0 1px 3px #000;
}

.entryBox span{

  width:18px;
  height:18px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#0006;

  font-size:9px;
}

.entryBox b{
  font-size:11px;
}

.entryA{
  border-color:#d44b5b55;
}

.entryB{
  border-color:#d4872855;
}

.entryC{
  border-color:#398bc955;
}

.entryD{
  border-color:#7355c555;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:16px;

  background:#03050aec;
}

.overlay.show{
  display:flex;
}

.panel{

  width:100%;

  max-width:420px;

  padding:20px;

  border-radius:22px;

  border:1px solid #3b4452;

  background:#191e27;

  box-shadow:
    0 15px 50px #000b;

  text-align:center;

  animation:
    panelIn .3s ease;
}

@keyframes panelIn{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.nextQuiz{

  color:#8e99a8;

  font-size:10px;

  font-weight:bold;

  letter-spacing:2px;
}

.introCategory{

  margin-top:10px;

  font-size:28px;

  font-weight:1000;
}

.introDifficulty{

  display:inline-block;

  margin-top:9px;

  padding:7px 15px;

  border-radius:20px;

  font-size:11px;

  font-weight:1000;
}

.getReady{

  margin-top:25px;

  color:#a6afbc;

  font-size:11px;

  font-weight:bold;
}

.startTitle{

  font-size:20px;

  font-weight:1000;
}

.countNumber{

  margin-top:8px;

  font-size:76px;

  line-height:1;

  font-weight:1000;

  animation:
    countPulse .7s infinite alternate;
}

@keyframes countPulse{

  from{
    transform:scale(.9);
    opacity:.65;
  }

  to{
    transform:scale(1.08);
    opacity:1;
  }

}

.startInfo{

  margin-top:12px;

  color:#98a2b1;

  font-size:10px;
}

.bossTitle{

  color:#d76aff;

  font-size:32px;

  font-weight:1000;

  text-shadow:
    0 0 20px #c844ff;

  animation:
    bossTitle 1s infinite alternate;
}

@keyframes bossTitle{

  from{
    transform:scale(.97);
  }

  to{
    transform:scale(1.04);
  }

}

.bossPlus{

  margin-top:8px;

  color:#ffd84d;

  font-size:20px;

  font-weight:1000;
}

.bossInfo{

  margin-top:12px;

  color:#a8b0bd;

  font-size:10px;

  font-weight:bold;
}

.resultTitle{

  font-size:22px;

  font-weight:1000;
}

.correctAnswer{

  margin-top:7px;

  color:#63ff98;

  font-size:11px;

  font-weight:bold;
}

.section{

  margin-top:9px;

  padding:9px;

  border-radius:14px;

  background:#0f1319;
}

.sectionTitle{

  margin-bottom:6px;

  color:#8e98a7;

  font-size:8px;

  font-weight:bold;
}

.playerList{

  max-height:92px;

  overflow:hidden;
}

.player{

  display:flex;

  align-items:center;

  gap:7px;

  padding:3px;

  font-size:10px;

  font-weight:bold;
}

.player img{

  width:27px;
  height:27px;

  border-radius:50%;

  border:2px solid white;

  object-fit:cover;
}

.player small{

  margin-left:auto;

  color:#68ff99;

  font-size:8px;
}

.first{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:4px;

  font-size:10px;
}

.first img{

  width:50px;
  height:50px;

  border-radius:50%;

  border:3px solid white;

  object-fit:cover;
}

.roundPoints{

  margin-top:8px;

  color:#67ff98;

  font-size:12px;

  font-weight:1000;
}

.next{

  margin-top:11px;

  color:#727d8c;

  font-size:8px;
}

.finalTitle{

  font-size:40px;

  font-weight:1000;
}

.finalSub{

  margin-top:5px;

  color:#a2acba;

  font-size:10px;
}

.finalScore{

  margin-top:12px;

  font-size:28px;

  font-weight:1000;
}

.finalWinner{

  margin-top:14px;

  padding:13px;

  border-radius:15px;

  font-size:18px;

  font-weight:1000;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-height:650px){

  }

  }

    font-size:20px;
  }

  .teamScore{

  }

  .questionBox{

  }

  .question{
    font-size:14px;
  }

  }

  .joinName{
    height:17px;

  }

  .genderCounter{

  }

    height:23px;

  }

  }

  }

  }

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px){

  .answer{
    height:43px;
    font-size:12px;
  }

  .answer span{
    width:28px;
    height:28px;
  }

  .answer label{
    padding-right:36px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =================================================

  <div class="scores">

      ></div>

        </div>

  <!-- =================================================

 <!-- =================================================

<!-- ===================================================
     OVERLAY
=================================================== -->

<div
  class="overlay"

></div>


<!-- ===================================================
     AUDIO
=================================================== -->

<audio
  id="bgm2"
  src="audio/bgm2.mp3"
  loop
  preload="auto"
></audio>


<audio
  id="tamaSound"
  src="audio/tama.mp3"
  preload="auto"
></audio>


<audio
  id="timerSound"
  src="audio/timer.mp3"
  preload="auto"
></audio>


<script>


/* =====================================================
   AUDIO
===================================================== */

const bgm2 =
  document.getElementById("bgm2");

const tamaSound =
  document.getElementById("tamaSound");

const timerSound =
  document.getElementById("timerSound");


const bgm1List = [

  new Audio("audio/bgm1-1.mp3"),
  new Audio("audio/bgm1-2.mp3"),
  new Audio("audio/bgm1-3.mp3"),
  new Audio("audio/bgm1-4.mp3"),
  new Audio("audio/bgm1-5.mp3"),
  new Audio("audio/bgm1-6.mp3"),
  new Audio("audio/bgm1-7.mp3"),
  new Audio("audio/bgm1-8.mp3")

];


bgm2.volume=.12;

tamaSound.volume=0;

timerSound.volume=.8;


bgm1List.forEach(audio=>{

  audio.volume=0;

  audio.preload="auto";

});


let audioUnlocked=false;

let activeBgm1=null;

let bgm1Timer=null;

let bgm1StartTime=0;

let categoryMode=false;


/* =====================================================
   AUDIO UNLOCK
===================================================== */

function unlockAudio(){

  if(audioUnlocked)
    return;

  audioUnlocked=true;


  bgm2.muted=false;

  bgm2.volume=.12;

  bgm2.play().catch(()=>{});


  tamaSound.muted=true;

  tamaSound.play().then(()=>{

    tamaSound.pause();

    tamaSound.currentTime=0;

    tamaSound.muted=false;

    tamaSound.volume=0;

  }).catch(()=>{});


  timerSound.muted=true;

  timerSound.play().then(()=>{

    timerSound.pause();

    timerSound.currentTime=0;

    timerSound.muted=false;

    timerSound.volume=.8;

  }).catch(()=>{});


  bgm1List.forEach(audio=>{

    audio.muted=true;

    audio.play().then(()=>{

      audio.pause();

      audio.currentTime=0;

      audio.muted=false;

      audio.volume=0;

    }).catch(()=>{});

  });

}


document.addEventListener(
  "click",
  unlockAudio,
  {once:true}
);

document.addEventListener(
  "touchstart",
  unlockAudio,
  {once:true}
);


/* =====================================================
   BGM
===================================================== */

function startBGM(){

  bgm2.volume=.12;

  bgm2.play().catch(()=>{});

}


function playRandomBgm1(){

  if(!audioUnlocked)
    return;


  bgm1List.forEach(audio=>{

    audio.pause();

    audio.currentTime=0;

    audio.volume=0;

  });


  const index =
    Math.floor(
      Math.random()*
      bgm1List.length
    );


  activeBgm1 =
    bgm1List[index];


  bgm2.volume=.035;


  activeBgm1.currentTime=0;

  activeBgm1.volume=1;

  activeBgm1.play().catch(()=>{});


  bgm1StartTime =
    performance.now();


  clearInterval(bgm1Timer);


  bgm1Timer =
    setInterval(
      updateBgm1,
      40
    );


  activeBgm1.onended =
    stopBgm1;

}


function updateBgm1(){

  if(!activeBgm1){

    clearInterval(bgm1Timer);

    return;
  }


  const elapsed =
    performance.now()-
    bgm1StartTime;


  if(elapsed<7000){

    activeBgm1.volume =
      categoryMode?.70:1;

  }

  else if(elapsed<8000){

    const p =
      (elapsed-7000)/
      1000;

    const volume =
      1-(.15*p);


    activeBgm1.volume =
      categoryMode
      ?Math.min(.70,volume)
      :volume;

  }

  else if(elapsed<13500){

    activeBgm1.volume =
      categoryMode?.70:.85;

  }

  else if(elapsed<15000){

    const p =
      (elapsed-13500)/
      1500;

    const startVolume =
      categoryMode?.70:.85;


    activeBgm1.volume =
      startVolume*(1-p);

  }

  else{

    stopBgm1();

  }

}


function stopBgm1(){

  clearInterval(bgm1Timer);

  bgm1Timer=null;


  if(activeBgm1){

    activeBgm1.pause();

    activeBgm1.currentTime=0;

    activeBgm1.volume=0;

    activeBgm1.onended=null;

  }


  activeBgm1=null;

  categoryMode=false;

  fadeBgm2();

}


function lowerBgm1ForCategory(){

  categoryMode=true;


  if(activeBgm1){

    activeBgm1.volume =
      Math.min(
        activeBgm1.volume,
        .70
      );

  }

}


function fadeBgm2(){

  const start=bgm2.volume;

  const target=.12;

  const duration=700;

  const startTime =
    performance.now();


  function fade(){

    const elapsed =
      performance.now()-
      startTime;


    const p =
      Math.min(
        elapsed/duration,
        1
      );


    bgm2.volume =
      start+
      (target-start)*p;


    if(p<1)
      requestAnimationFrame(fade);

  }


  requestAnimationFrame(fade);

}


function playRevealAudio(){

  if(!audioUnlocked)
    return;


  tamaSound.pause();

  tamaSound.currentTime=0;

  tamaSound.volume=.85;

  tamaSound.play().catch(()=>{});


  playRandomBgm1();

}

/* =====================================================

===================================================== */

const GENDER_STORAGE_KEY =
  "girls_boys_tikfinity_users_v1";

const ONE_MONTH =
  30*24*60*60*1000;

let genderUsers={};


/* =====================================================
   LOAD GENDER DATA
===================================================== */

function loadGenderUsers(){

  try{

    const saved =
      localStorage.getItem(
        GENDER_STORAGE_KEY
      );

    if(saved){

      genderUsers =
        JSON.parse(saved);

    }else{

      genderUsers={};

    }

  }catch(error){

    console.error(
      "Gender storage error:",
      error
    );

    genderUsers={};

  }

  cleanExpiredGenderUsers();

}


/* =====================================================
   SAVE GENDER DATA
===================================================== */

function saveGenderUsers(){

  try{

    localStorage.setItem(
      GENDER_STORAGE_KEY,
      JSON.stringify(genderUsers)
    );

  }catch(error){

    console.error(
      "Cannot save gender data:",
      error
    );

  }

}


/* =====================================================
   CLEAR DATA AFTER 1 MONTH
===================================================== */

function cleanExpiredGenderUsers(){

  const now =
    Date.now();

  let changed=false;

  Object.keys(genderUsers)
    .forEach(key=>{

      const user =
        genderUsers[key];

      if(
        !user ||
        !user.time ||
        now-user.time>=ONE_MONTH
      ){

        delete genderUsers[key];

        changed=true;

      }

    });

  if(changed)
    saveGenderUsers();

}


/* =====================================================
   NORMALIZE USER ID
===================================================== */

function normalizeUserId(value){

  if(
    value===undefined ||
    value===null
  )
    return "";

  return String(value)
    .trim()
    .toLowerCase();

}


/* =====================================================
   NORMALIZE GENDER COMMAND
===================================================== */

function detectGender(text){

  if(
    text===undefined ||
    text===null
  )
    return null;

  const value =
    String(text)
      .trim()
      .toLowerCase();

  if(
    value==="g" ||
    value==="girl" ||
    value==="girls" ||
    value==="babae"
  ){

    return "Girls";

  }

  if(
    value==="l" ||
    value==="boy" ||
    value==="boys" ||
    value==="lalaki"
  ){

    return "Boys";

  }

  return null;

}


/* =====================================================
   GET USER KEY
===================================================== */

function getUserKey(data){

  if(!data)
    return "";

  const user =
    data.user ||
    data;

  return normalizeUserId(

    user.uniqueId ||
    user.username ||
    user.tikfinityUsername ||
    user.userId ||
    user.tikfinityUserId ||
    user.nickname

  );

}


/* =====================================================
   GET NICKNAME
===================================================== */

function getNickname(data){

  if(!data)
    return "Unknown";

  const user =
    data.user ||
    data;

  return (
    user.nickname ||
    user.uniqueId ||
    user.username ||
    user.tikfinityUsername ||
    "Unknown"
  );

}


/* =====================================================
   GET AVATAR
===================================================== */

function getAvatar(data){

  if(!data)
    return "";

  const user =
    data.user ||
    data;

  return (
    user.avatar ||
    user.avatarUrl ||
    user.avatarURL ||
    user.profilePictureUrl ||
    user.profilePicture ||
    user.profilePic ||
    user.photoUrl ||
    user.photoURL ||
    ""
  );

}


/* =====================================================
   REGISTER GENDER
===================================================== */

function registerGender(
  userId,
  nickname,
  gender
){

  const key =
    normalizeUserId(userId);

  if(!key)
    return;

  genderUsers[key]={

    id:key,

    nickname:
      nickname ||
      key,

    gender:gender,

    time:
      Date.now()

  };

  saveGenderUsers();

  updateGenderCounter();

}


/* =====================================================

===================================================== */

function getGenderCounts(){

  let girls=0;

  let boys=0;

  Object.values(genderUsers)
    .forEach(user=>{

      if(user.gender==="Girls")
        girls++;

      if(user.gender==="Boys")
        boys++;

    });

  return {
    girls,
    boys
  };

}

/* =====================================================
   FIND SAVED GENDER
===================================================== */

function getSavedGender(
  userId
){

  const key =
    normalizeUserId(userId);

  if(!key)
    return null;

  const user =
    genderUsers[key];

  if(!user)
    return null;

  if(
    Date.now()-user.time>=ONE_MONTH
  ){

    delete genderUsers[key];

    saveGenderUsers();

    updateGenderCounter();

    return null;

  }

  return user.gender;

}

  )

      .trim();

    normalizeUserId(
      userId ||

    );


  /*
     FIRST:
     GENDER COMMAND
  */

  const genderCommand =
    detectGender(
      cleanComment
    );


  if(genderCommand){

    processGenderComment(
      key,
      nickname,
      cleanComment
    );

    return;

  }


  /*
     SECOND:
     A/B/C/D ANSWER
  */

  processAnswerComment(
    key,
    nickname,
    cleanComment,
    avatar
  );

}


/* =====================================================
   EXTRACT CHAT FROM RAW MESSAGE
===================================================== */

function parseRawChatMessage(
  message
){

  if(
    message===undefined ||
    message===null
  )
    return;


  /*
     OBJECT
  */

  if(typeof message==="object"){

    handleTikfinityEvent(
      message
    );

    return;

  }


  const raw =
    String(message)
      .trim();

  if(!raw)
    return;


  console.log(
    "RAW TIKFINITY:",
    raw
  );


  /*
     FORMAT:

     CHAT: JESihope: L
  */

  const chatMatch =
    raw.match(
      /^CHAT\s*:\s*(.*?)\s*:\s*(.*?)\s*$/i
    );


  if(chatMatch){

    const nickname =
      chatMatch[1].trim();

    const comment =
      chatMatch[2].trim();

    processChat(
      nickname,
      comment,
      nickname,
      ""
    );

    return;

  }


  /*
     JSON STRING
  */

  try{

    const json =
      JSON.parse(raw);

    handleTikfinityEvent(
      json
    );

    return;

  }catch(error){}

}


/* =====================================================
   TIKFINITY EVENT HANDLER
===================================================== */

function handleTikfinityEvent(
  eventData
){

  if(!eventData)
    return;


  /*
     Possible:

     {
       event:"chat",
       data:{
         nickname:"JESihope",
         comment:"A"
       }
     }
  */

  const event =
    String(
      eventData.event ||
      eventData.type ||
      eventData.action ||
      ""
    ).toLowerCase();


  const data =
    eventData.data ||
    eventData;


  /*
     CHAT EVENT
  */

  if(
    event==="chat" ||
    event==="comment" ||
    event==="message" ||
    event==="chatmessage"
  ){

    const nickname =
      getNickname(data);

    const comment =
      data.comment ||
      data.message ||
      data.text ||
      data.content;

    const userId =
      getUserKey(data);

    const avatar =
      getAvatar(data);


    processChat(
      nickname,
      comment,
      userId,
      avatar
    );

    return;

  }


  /*
     MEMBER EVENT
  */

  if(
    event==="member" ||
    event==="roomuser"
  ){

    const nickname =
      getNickname(data);

    const userId =
      getUserKey(data);

    const savedGender =
      getSavedGender(
        userId
      );

    if(savedGender){

      showMemberName(
        nickname,
        savedGender
      );

    }

    return;

  }


  /*
     DIRECT CHAT DATA
  */

  if(
    data &&
    (
      data.comment ||
      data.message ||
      data.text ||
      data.content
    )
  ){

    const nickname =
      getNickname(data);

    const comment =
      data.comment ||
      data.message ||
      data.text ||
      data.content;

    const userId =
      getUserKey(data);

    const avatar =
      getAvatar(data);


    processChat(
      nickname,
      comment,
      userId,
      avatar
    );

  }

}

const TIKFINITY_WS_URL =
  "ws://localhost:21213";

let tikfinityWS=null;

let wsReconnectTimer=null;


function connectTikfinity(){

  if(
    typeof WebSocket==="undefined"
  ){

    console.log(
      "WebSocket not supported."
    );

    return;

  }


  try{

    console.log(
      "Connecting to Tikfinity:",
      TIKFINITY_WS_URL
    );


    tikfinityWS =
      new WebSocket(
        TIKFINITY_WS_URL
      );


    tikfinityWS.onopen =
      ()=>{

        console.log(
          "Tikfinity WebSocket CONNECTED"
        );

        statusEl.textContent =
          "TIKFINITY CONNECTED • A/B/C/D • G/L";

      };


    tikfinityWS.onmessage =
      event=>{

        console.log(
          "TIKFINITY MESSAGE:",
          event.data
        );

        parseRawChatMessage(
          event.data
        );

      };


    tikfinityWS.onerror =
      error=>{

        console.log(
          "Tikfinity WebSocket error:",
          error
        );

      };


    tikfinityWS.onclose =
      ()=>{

        console.log(
          "Tikfinity WebSocket disconnected."
        );


        clearTimeout(
          wsReconnectTimer
        );


        wsReconnectTimer =
          setTimeout(
            connectTikfinity,
            3000
          );

      };

  }catch(error){

    console.error(
      "WebSocket connection error:",
      error
    );


    clearTimeout(
      wsReconnectTimer
    );


    wsReconnectTimer =
      setTimeout(
        connectTikfinity,
        3000
      );

  }

}

  );


function resetLiveEntryCounter(){

  liveEntryCounts={
    A:0,
    B:0,
    C:0,
    D:0
  };


  updateLiveEntryCounter();

}


function updateLiveEntryCounter(){

  entryA.textContent =
    liveEntryCounts.A;

  entryB.textContent =
    liveEntryCounts.B;

  entryC.textContent =
    liveEntryCounts.C;

  entryD.textContent =
    liveEntryCounts.D;

}


function addLiveEntry(
  answer
){

  if(
    !["A","B","C","D"]
      .includes(answer)
  )
    return;


  liveEntryCounts[answer]++;


  updateLiveEntryCounter();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  const arr =
    array.slice();

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*
        (i+1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =====================================================
   SELECT QUESTION
===================================================== */

function selectQuestion(){

  if(
    questionNumber>0 &&
    questionNumber%15===0
  ){

    current =
      bossQuestions[
        Math.floor(
          Math.random()*
          bossQuestions.length
        )
      ];

  }else{

    current =
      questionBank[
        Math.floor(
          Math.random()*
          questionBank.length
        )
      ];

  }

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  clearInterval(timer);


  questionNumber=0;

  girlsScore=0;

  boysScore=0;


  liveAnswerEntries=[];

  scoredUsers =
    new Set();

  firstCorrectPlayer=null;


  resetLiveEntryCounter();

  updateScores();

  showCategoryIntro();

}


/* =====================================================
   CATEGORY INTRO
===================================================== */

const overlay =
  document.getElementById(
    "overlay"
  );

const qNumberEl =
  document.getElementById(
    "qNumber"
  );

const categoryEl =
  document.getElementById(
    "category"
  );

const difficultyEl =
  document.getElementById(
    "difficulty"
  );

const questionEl =
  document.getElementById(
    "question"
  );

const timerBar =
  document.getElementById(
    "timerBar"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const commentsEl =
  document.getElementById(
    "comments"
  );

const buttons =
  document.querySelectorAll(
    ".answer"
  );


function showCategoryIntro(){

  selectQuestion();


  clearInterval(timer);


  overlay.classList.add(
    "show"
  );


  /*
     Boss every 15 questions.
  */

  if(
    questionNumber>0 &&
    questionNumber%15===0
  ){

    overlay.innerHTML=`

      <div class="panel">

        <div class="bossTitle">
          ⚡ BOSS QUESTION ⚡
        </div>

        <div class="bossPlus">
          +10 POINTS
        </div>

        <div class="bossInfo">
          SUPER HARD
          <br><br>
          ${current.category}
        </div>

      </div>

    `;

  }else{

    const difficultyClass =
      current.difficulty==="Easy"
      ?"easy"
      :current.difficulty==="Medium"
      ?"medium"
      :"hard";


    overlay.innerHTML=`

      <div class="panel">

        <div class="nextQuiz">
          QUESTION ${questionNumber+1}
        </div>

        <div class="introCategory">
          ${current.category}
        </div>

        <div class="introDifficulty ${difficultyClass}">
          ${current.difficulty.toUpperCase()}
          ×${current.points}
        </div>

        <div class="getReady">
          GET READY
        </div>

      </div>

    `;

  }


  setTimeout(
    showStartCountdown,
    (
      questionNumber>0 &&
      questionNumber%15===0
    )
    ?2800
    :2200
  );

}


/* =====================================================
   COUNTDOWN
===================================================== */

function showStartCountdown(){

  let count=5;


  overlay.innerHTML=`

    <div class="panel">

      <div class="startTitle">
        START THE QUIZ IN
      </div>

      <div
        class="countNumber"
        id="startNumber"
      >
        5
      </div>

      <div class="startInfo">
        ${current.category}
        •
        ${current.difficulty}
        •
        +${current.points}
      </div>

    </div>

  `;


  startBGM();


  const number =
    document.getElementById(
      "startNumber"
    );


  const countdown =
    setInterval(()=>{

      count--;


      if(count<=0){

        clearInterval(
          countdown
        );


        overlay.classList.remove(
          "show"
        );


        questionNumber++;


        loadQuestion();


        return;

      }


      number.textContent =
        count;

    },1000);

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

  /*
     IMPORTANT:
     RESET EVERYTHING FOR NEW QUESTION.
  */

  liveAnswerEntries=[];

  scoredUsers =
    new Set();

  firstCorrectPlayer=null;


  resetLiveEntryCounter();


  qNumberEl.textContent =
    "QUESTION "+
    questionNumber;


  categoryEl.textContent =
    current.category;


  if(
    current.difficulty==="SUPER HARD"
  ){

    difficultyEl.textContent =
      "SUPER HARD +10";


    difficultyEl.className =
      "badge bossBadge";

  }else{

    difficultyEl.textContent =
      current.difficulty.toUpperCase()+
      " ×"+
      current.points;


    difficultyEl.className =
      "badge "+
      (
        current.difficulty==="Easy"
        ?"easy"
        :current.difficulty==="Medium"
        ?"medium"
        :"hard"
      );

  }


  questionEl.textContent =
    current.question;


  buttons.forEach(
    (button,index)=>{

      button.disabled=false;


      button.classList.remove(
        "correct",
        "wrong",
        "blink"
      );


      button.querySelector(
        "label"
      ).textContent =
        current.choices[index];

    }
  );


  statusEl.textContent =
    current.difficulty==="SUPER HARD"

    ? "Comment A, B, C, D for 10 points entry"

    : "Comment A, B, C, D for "+
      current.points+
      " point"+
      (
        current.points>1
        ?"s"
        :""
      )+
      " entry";


  startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  clearInterval(timer);


  timerSound.pause();

  timerSound.currentTime=0;


  timerBar.style.width =
    "100%";

  timerBar.style.background =
    "#21dc68";


  questionStart =
    performance.now();


  let timerSoundPlayed=false;


  timer =
    setInterval(()=>{

      const elapsed =
        performance.now()-
        questionStart;


      const remaining =
        Math.max(
          0,
          QUESTION_TIME-elapsed
        );


      const percent =
        remaining/
        QUESTION_TIME*
        100;


      timerBar.style.width =
        percent+"%";


      if(
        remaining<=10000 &&
        !timerSoundPlayed
      ){

        timerSoundPlayed=true;


        if(audioUnlocked){

          timerSound.pause();

          timerSound.currentTime=0;

          timerSound.volume=.8;

          timerSound.play()
            .catch(()=>{});

        }

      }


      if(percent<=50)
        timerBar.style.background =
          "#ffd43b";


      if(percent<=15)
        timerBar.style.background =
          "#ff4d5d";


      if(remaining<=0){

        clearInterval(timer);


        timerSound.pause();

        timerSound.currentTime=0;


        finishQuestion();

      }

    },40);

}


/* =====================================================
   CREATE LIVE AVATAR
===================================================== */

function createAvatar(
  player
){

  const img =
    document.createElement(
      "img"
    );


  img.className =
    "avatar";


  img.src =
    player.image ||
    fallbackAvatar(
      player.userId,
      player.name
    );


  img.title =
    player.name+
    " • "+
    player.team+
    " • "+
    player.answer;


  img.alt =
    player.name;


  img.onerror =
    ()=>{

      img.onerror=null;

      img.src =
        fallbackAvatar(
          player.userId,
          player.name
        );

    };


  const max =
    Math.max(
      3,
      commentsEl.clientWidth-45
    );


  img.style.left =
    Math.random()*
    max+
    "px";


  if(
    player.team==="Girls"
  ){

    img.style.borderColor =
      "#f34b91";

  }

  else if(
    player.team==="Boys"
  ){

    img.style.borderColor =
      "#3c94ff";

  }

  else{

    img.style.borderColor =
      "#ffffff";

  }


  commentsEl.appendChild(
    img
  );


  setTimeout(
    ()=>{
      img.remove();
    },
    3600
  );

}


/* =====================================================
   FINISH QUESTION
===================================================== */

function finishQuestion(){

  clearInterval(timer);


  timerSound.pause();

  timerSound.currentTime=0;


  buttons.forEach(
    button=>{

      button.disabled=true;

    }
  );


  const correctButton =
    document.querySelector(
      `[data-answer="${current.correct}"]`
    );


  if(correctButton){

    correctButton.classList.add(
      "blink"
    );

  }


  playRevealAudio();


  statusEl.textContent =
    "REVEALING ANSWER...";


  setTimeout(()=>{

    if(correctButton){

      correctButton.classList.remove(
        "blink"
      );

      correctButton.classList.add(
        "correct"
      );

    }


    showResults();

  },3000);

}


/* =====================================================
   RESULTS
===================================================== */

function showResults(){

  /*
     REAL LIVE ENTRIES ONLY
  */

  const correctPlayers =
    liveAnswerEntries.filter(
      player =>
        player.answer ===
        current.correct
    );


  let girlsRound=0;

  let boysRound=0;


  /*
     Score each unique user once.
  */

  const alreadyScored =
    new Set();


  correctPlayers.forEach(
    player=>{

      const key =
        normalizeUserId(
          player.userId ||
          player.name
        );


      if(
        alreadyScored.has(key)
      ){

        return;

      }


      alreadyScored.add(key);


      if(
        player.team==="Girls"
      ){

        girlsRound +=
          current.points;

      }

      else if(
        player.team==="Boys"
      ){

        boysRound +=
          current.points;

      }

    }
  );


  /*
     ADD TEAM POINTS
  */

  girlsScore +=
    girlsRound;

  boysScore +=
    boysRound;


  updateScores();


  const correctIndex =
    current.correct.charCodeAt(0)-65;


  const first =
    firstCorrectPlayer;


  overlay.innerHTML=`

    <div class="panel">

      <div class="resultTitle">
        RESULTS
      </div>


      <div class="correctAnswer">

        CORRECT:
        ${current.correct}
        —
        ${current.choices[correctIndex]}

      </div>


      <div class="section">

        <div class="sectionTitle">

          ${correctPlayers.length}
          LIVE ENTRIES GOT IT RIGHT

        </div>


        <div
          class="playerList"
          id="correctList"
        ></div>

      </div>


      <div class="section">

        <div class="sectionTitle">
          FIRST TO ANSWER
        </div>


        <div
          class="first"
          id="firstPlayer"
        ></div>

      </div>


      <div class="roundPoints">

        GIRLS +${girlsRound}

        &nbsp; • &nbsp;

        BOYS +${boysRound}

      </div>


      <div class="next">
        NEXT QUESTION...
      </div>

    </div>

  `;


  const list =
    document.getElementById(
      "correctList"
    );


  correctPlayers.forEach(
    player=>{

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "player";


      row.innerHTML=`

        <img
          src="${player.image}"
          alt=""
        >

        <span>
          ${player.name}
        </span>

        <small>

          ${
            player.team==="Unknown"
            ?"NO GENDER"
            :player.team
          }

          ${
            player.team==="Girls" ||
            player.team==="Boys"
            ? " +"+current.points
            : ""
          }

        </small>

      `;


      list.appendChild(
        row
      );

    }
  );


  const firstBox =
    document.getElementById(
      "firstPlayer"
    );


  if(first){

    firstBox.innerHTML=`

      <img
        src="${first.image}"
        alt=""
      >

      <strong>
        ${first.name}
      </strong>

      <span
        class="badge"
        style="
          background:
          ${
            first.team==="Girls"
            ?"#d92b78"
            :first.team==="Boys"
            ?"#267ff0"
            :"#596575"
          };
        "
      >

        ${first.team}

      </span>

    `;

  }else{

    firstBox.innerHTML=`

      <strong>
        NO CORRECT LIVE ANSWER
      </strong>

    `;

  }


  overlay.classList.add(
    "show"
  );


  /*
     WIN
  */

  if(
    girlsScore>=1000 ||
    boysScore>=1000
  ){

    setTimeout(
      showWinner,
      3000
    );

    return;

  }


  /*
     NEXT QUESTION
  */

  setTimeout(()=>{

    overlay.classList.remove(
      "show"
    );


    /*
       RESET COUNTER BEFORE
       THE NEXT QUESTION.
    */

    resetLiveEntryCounter();


    showCategoryIntro();

  },4500);

}


/* =====================================================
   WINNER
===================================================== */

function showWinner(){

  clearInterval(timer);


  let winner;


  if(
    girlsScore>=1000 &&
    boysScore>=1000
  ){

    winner =
      girlsScore>boysScore
      ?"GIRLS WIN"
      :boysScore>girlsScore
      ?"BOYS WIN"
      :"DRAW";

  }

  else if(
    girlsScore>=1000
  ){

    winner =
      "GIRLS WIN";

  }

  else{

    winner =
      "BOYS WIN";

  }


  overlay.innerHTML=`

    <div class="panel">

      <div class="finalTitle">
        ${winner}
      </div>

      <div class="finalSub">
        FIRST TEAM TO REACH 1000
      </div>

      <div class="finalScore">
        GIRLS: ${girlsScore}
      </div>

      <div class="finalScore">
        BOYS: ${boysScore}
      </div>

      <div
        class="finalWinner"
        style="
          background:
          ${
            winner==="GIRLS WIN"
            ?"#741541"
            :"#153c80"
          };
        "
      >

        ${winner}

      </div>

      <div class="next">
        NEW GAME STARTING...
      </div>

    </div>

  `;


  overlay.classList.add(
    "show"
  );


  setTimeout(()=>{

    overlay.classList.remove(
      "show"
    );


    startGame();

  },5000);

}


/* =====================================================
   MANUAL ANSWER
===================================================== */

buttons.forEach(
  button=>{

    button.addEventListener(
      "click",
      ()=>{

        if(
          button.disabled ||
          !current
        )
          return;


        clearInterval(timer);


        timerSound.pause();

        timerSound.currentTime=0;


        buttons.forEach(
          b=>{
            b.disabled=true;
          }
        );


        if(
          button.dataset.answer===
          current.correct
        ){

          button.classList.add(
            "correct"
          );

        }

        else{

          button.classList.add(
            "wrong"
          );


          const correctButton =
            document.querySelector(
              `[data-answer="${current.correct}"]`
            );


          if(correctButton){

            correctButton.classList.add(
              "correct"
            );

          }

        }


        finishQuestion();

      }
    );

  }
);
