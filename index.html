<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EchoMix</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

/* =========================
   MAIN
========================= */

.home{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #222 0%,
            #0b0b0b 45%,
            #050505 100%
        );
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1200px;
    text-align:center;
}

/* =========================
   LOGO
========================= */

.logo{
    font-size:clamp(42px,7vw,90px);
    font-weight:900;
    letter-spacing:4px;

    margin-bottom:10px;

    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00d9ff,
            #8b5cff,
            #ff00cc
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    filter:
        drop-shadow(
            0 0 15px
            rgba(0,255,150,.25)
        );
}

.subtitle{
    font-size:clamp(15px,2vw,22px);
    color:#aaa;
    margin-bottom:50px;
}

/* =========================
   BUTTON AREA
========================= */

.buttons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:25px;

    width:100%;
    max-width:1100px;

    margin:auto;
}

/* =========================
   BUTTON
========================= */

.menu-button{
    position:relative;

    min-height:230px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    border:2px solid #333;
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.02)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        inset 0 1px 0
        rgba(255,255,255,.08);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;

    overflow:hidden;
}

.menu-button::before{
    content:"";

    position:absolute;
    inset:-2px;

    border-radius:25px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );

    opacity:0;

    transition:.3s;
}

.menu-button:hover{
    transform:
        translateY(-8px)
        scale(1.02);
}

.menu-button:hover::before{
    opacity:1;
}

/* =========================
   ICON
========================= */

.icon{
    font-size:70px;
    margin-bottom:20px;

    position:relative;
    z-index:1;
}

/* =========================
   TITLE
========================= */

.button-title{
    font-size:30px;
    font-weight:800;

    position:relative;
    z-index:1;
}

/* =========================
   DESCRIPTION
========================= */

.button-description{
    margin-top:8px;

    font-size:15px;
    color:#999;

    position:relative;
    z-index:1;
}

/* =========================
   HOSTING QUIZ
========================= */

.hosting:hover{
    border-color:#00ff88;

    box-shadow:
        0 20px 60px
        rgba(0,255,136,.18),

        0 0 25px
        rgba(0,255,136,.15);
}

/* =========================
   CONTROLLER
========================= */

.controller:hover{
    border-color:#00d9ff;

    box-shadow:
        0 20px 60px
        rgba(0,217,255,.18),

        0 0 25px
        rgba(0,217,255,.12);
}

/* =========================
   VIDEOKE
========================= */

.videoke:hover{
    border-color:#ff00cc;

    box-shadow:
        0 20px 60px
        rgba(255,0,204,.18),

        0 0 25px
        rgba(255,0,204,.12);
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:50px;
    color:#666;
    font-size:13px;
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .buttons{
        grid-template-columns:
            repeat(2,1fr);

        max-width:750px;
    }

    .menu-button{
        min-height:210px;
    }

    .icon{
        font-size:60px;
    }

    .button-title{
        font-size:26px;
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .home{
        padding:20px 15px;
        min-height:100vh;
    }

    .logo{
        font-size:42px;
        letter-spacing:2px;
        margin-bottom:8px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:30px;
    }

    .buttons{
        grid-template-columns:1fr;
        gap:18px;
        max-width:420px;
    }

    .menu-button{
        min-height:175px;
        border-radius:20px;
    }

    .menu-button::before{
        border-radius:20px;
    }

    .icon{
        font-size:52px;
        margin-bottom:12px;
    }

    .button-title{
        font-size:24px;
    }

    .button-description{
        font-size:13px;
        margin-top:6px;
    }

    .footer{
        margin-top:30px;
        font-size:11px;
    }

}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

    .logo{
        font-size:35px;
    }

    .subtitle{
        margin-bottom:22px;
    }

    .menu-button{
        min-height:150px;
    }

    .icon{
        font-size:45px;
        margin-bottom:8px;
    }

    .button-title{
        font-size:21px;
    }

}

</style>

</head>


<body>

<div class="home">

    <div class="container">

        <!-- LOGO -->

        <div class="logo">
            ECHOMIX
        </div>

        <div class="subtitle">
            Choose an application
        </div>


        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="buttons">


            <!-- HOSTING QUIZ -->

            <a
                href="https://echomixjstv-hash.github.io/quizhost/"
                class="menu-button hosting"
            >

                <div class="icon">
                    🖥️
                </div>

                <div class="button-title">
                    HOST A QUIZ
                </div>

                <div class="button-description">
                    Open Quiz Host
                </div>

            </a>


            <!-- CONTROLLER -->

            <a
                href="https://echomixjstv-hash.github.io/quizhosting/controller.html"
                class="menu-button controller"
            >

                <div class="icon">
                    🎮
                </div>

                <div class="button-title">
                    CONTROLLER
                </div>

                <div class="button-description">
                    Open Quiz Controller
                </div>

            </a>


            <!-- ECHOMIX VIDEOKE -->

            <a
                href="echomix videoke.html"
                class="menu-button videoke"
            >

                <div class="icon">
                    🎤
                </div>

                <div class="button-title">
                    ECHOMIX VIDEOKE
                </div>

                <div class="button-description">
                    Open EchoMix Videoke
                </div>

            </a>


        </div>


        <!-- FOOTER -->

        <div class="footer">
            © 2026 EchoMix
        </div>

    </div>

</div>

</body>

</html>
