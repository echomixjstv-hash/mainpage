<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoMix Review Center</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

.home{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    background:
        radial-gradient(
            circle at 50% 35%,
            #222 0%,
            #0b0b0b 45%,
            #050505 100%
        );
}

.container{
    width:100%;
    max-width:1100px;
    text-align:center;
}

.logo{
    font-size:clamp(40px,7vw,80px);
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:8px;
    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00d9ff,
            #8b5cff,
            #ff00cc
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

.subtitle{
    font-size:clamp(15px,2vw,22px);
    color:#aaa;
    margin-bottom:45px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    width:100%;
}

.menu-button{
    position:relative;
    min-height:230px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    border:2px solid #333;
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.02)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    overflow:hidden;
}

.menu-button:hover{
    transform:translateY(-8px) scale(1.02);
}

.icon{
    font-size:65px;
    margin-bottom:20px;
}

.button-title{
    font-size:28px;
    font-weight:800;
}

.button-description{
    margin-top:8px;
    font-size:15px;
    color:#999;
}

/* CSE */

.cse:hover{
    border-color:#00ff88;

    box-shadow:
        0 20px 60px rgba(0,255,136,.18),
        0 0 25px rgba(0,255,136,.15);
}

/* LET */

.let:hover{
    border-color:#00d9ff;

    box-shadow:
        0 20px 60px rgba(0,217,255,.18),
        0 0 25px rgba(0,217,255,.12);
}

/* OTHER */

.other:hover{
    border-color:#ff00cc;

    box-shadow:
        0 20px 60px rgba(255,0,204,.18),
        0 0 25px rgba(255,0,204,.12);
}

.back{
    display:inline-block;
    margin-top:35px;

    padding:12px 25px;

    border:1px solid #444;
    border-radius:12px;

    color:#aaa;
    text-decoration:none;

    transition:.25s;
}

.back:hover{
    color:#fff;
    border-color:#fff;
}

.footer{
    margin-top:35px;
    color:#666;
    font-size:13px;
}

@media(max-width:900px){

    .buttons{
        grid-template-columns:repeat(2,1fr);
        max-width:750px;
        margin:auto;
    }

}

@media(max-width:600px){

    .home{
        padding:20px 15px;
    }

    .logo{
        font-size:40px;
        letter-spacing:2px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:30px;
    }

    .buttons{
        grid-template-columns:1fr;
        gap:18px;
        max-width:420px;
    }

    .menu-button{
        min-height:175px;
        border-radius:20px;
    }

    .icon{
        font-size:52px;
        margin-bottom:12px;
    }

    .button-title{
        font-size:24px;
    }

    .button-description{
        font-size:13px;
    }

}
</style>
</head>

<body>

<div class="home">

<div class="container">

    <div class="logo">
        REVIEW CENTER
    </div>

    <div class="subtitle">
        Choose a reviewer
    </div>

    <div class="buttons">

        <!-- CSE REVIEWER -->

        <a
            href="https://echomixjstv-hash.github.io/civilservice/"
            class="menu-button cse"
        >

            <div class="icon">
                📚
            </div>

            <div class="button-title">
                CSE REVIEWER
            </div>

            <div class="button-description">
                Civil Service Examination
            </div>

        </a>


        <!-- LET REVIEWER -->

        <a
            href="#"
            class="menu-button let"
        >

            <div class="icon">
                🎓
            </div>

            <div class="button-title">
                LET REVIEWER
            </div>

            <div class="button-description">
                Licensure Examination for Teachers
            </div>

        </a>


        <!-- OTHER REVIEWERS -->

        <a
            href="#"
            class="menu-button other"
        >

            <div class="icon">
                📝
            </div>

            <div class="button-title">
                OTHER REVIEWERS
            </div>

            <div class="button-description">
                More reviewers coming soon
            </div>

        </a>

    </div>

    <a href="index.html" class="back">
        ← Back to EchoMix
    </a>

    <div class="footer">
        © 2026 EchoMix Review Center
    </div>

</div>

</div>

</body>
</html>
